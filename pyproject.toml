[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-opd"
version = "0.1.0"
description = "On-policy distillation for joint World-Action Models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "ylhaichen"}]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["numpy", "pytest>=8,<9"]
runtime = [
  "accelerate",
  "diffusers==0.36.0",
  "einops",
  "msgpack",
  "numpy",
  "opencv-python",
  "transformers==4.55.2",
  "websockets",
]

[tool.setuptools.packages.find]
include = ["experiments*"]

[tool.pytest.ini_options]
pythonpath = ["."]
